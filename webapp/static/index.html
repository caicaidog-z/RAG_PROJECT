<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Backend Console</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">RAG Backend</p>
        <h1>知识库控制台</h1>
      </div>
      <div class="status-strip">
        <div class="status-card">
          <span class="status-label">Milvus</span>
          <strong id="milvusStatus">checking</strong>
        </div>
        <div class="status-card">
          <span class="status-label">Collection</span>
          <strong id="collectionName">-</strong>
        </div>
        <div class="status-card">
          <span class="status-label">OCR</span>
          <strong id="ocrStatus">-</strong>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside class="control-column">
        <section class="panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">System</p>
              <h2>运行状态</h2>
            </div>
            <button class="ghost-button" id="refreshHealthButton" type="button">刷新</button>
          </div>
          <dl class="kv-grid">
            <div>
              <dt>Milvus 详情</dt>
              <dd id="milvusDetail">-</dd>
            </div>
            <div>
              <dt>上传目录</dt>
              <dd id="uploadDir">-</dd>
            </div>
            <div>
              <dt>任务状态</dt>
              <dd id="jobState">-</dd>
            </div>
          </dl>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Ingest</p>
              <h2>从本机目录入库</h2>
            </div>
          </div>
          <form id="pathIngestForm" class="stack-form">
            <label class="field">
              <span>目录路径</span>
              <input id="pathInput" name="path" type="text" placeholder="/Users/you/Documents/source_docs">
            </label>
            <label class="checkbox-row">
              <input id="pathConfirmReset" type="checkbox">
              <span>我知道这会重建当前 collection</span>
            </label>
            <button class="primary-button" type="submit">启动目录入库</button>
          </form>
          <p class="hint">只扫描目录顶层的 <code>.md</code> 和 <code>.pdf</code>。</p>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Upload</p>
              <h2>上传文件入库</h2>
            </div>
          </div>
          <form id="uploadIngestForm" class="stack-form">
            <label class="field">
              <span>选择文件</span>
              <input id="uploadFiles" type="file" accept=".md,.pdf" multiple>
            </label>
            <label class="checkbox-row">
              <input id="uploadConfirmReset" type="checkbox">
              <span>我知道这会重建当前 collection</span>
            </label>
            <button class="secondary-button" type="submit">上传并入库</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Jobs</p>
              <h2>最近任务</h2>
            </div>
            <button class="ghost-button" id="refreshJobsButton" type="button">刷新</button>
          </div>
          <div id="jobList" class="job-list"></div>
        </section>
      </aside>

      <section class="chat-column">
        <section class="panel answer-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Chat</p>
              <h2>问答与过程追踪</h2>
            </div>
            <span id="chatStatus" class="badge">idle</span>
          </div>

          <div id="conversation" class="conversation">
            <div class="empty-state">
              <h3>直接提问</h3>
              <p>这里会显示最终答案，下面会展示路由、检索和生成过程。</p>
            </div>
          </div>

          <form id="chatForm" class="chat-form">
            <label class="field grow">
              <span>问题</span>
              <textarea id="questionInput" rows="3" placeholder="例如：PECVD 相比传统热 CVD，沉积温度通常能降低多少？"></textarea>
            </label>
            <button class="primary-button" type="submit">开始提问</button>
          </form>
        </section>

        <section class="panel trace-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Trace</p>
              <h2>RAG 执行过程</h2>
            </div>
          </div>
          <div id="traceOutput" class="trace-output">
            <div class="empty-state compact">
              <p>还没有过程输出。</p>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <template id="jobCardTemplate">
    <article class="job-card">
      <div class="job-card-head">
        <strong class="job-id"></strong>
        <span class="badge job-status"></span>
      </div>
      <p class="job-source"></p>
      <p class="job-message"></p>
      <div class="job-meta"></div>
    </article>
  </template>

  <template id="traceCardTemplate">
    <article class="trace-card">
      <div class="trace-head">
        <strong class="trace-node"></strong>
        <span class="trace-doc-count"></span>
      </div>
      <div class="trace-body"></div>
    </article>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
